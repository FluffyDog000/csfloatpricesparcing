{% extends "base.html" %}
{% block title %}Журнал ордеров{% endblock %}
{% block content %}
<a class="back" href="{{ url_for('analysis_page') }}">← к анализу</a>
<h1>Журнал ордеров</h1>

<div class="journal-bar">
  <div class="journal-bar-text">
    <div class="muted" id="j-state"></div>
    <div class="muted" id="j-sync-state"></div>
  </div>
  <div class="journal-bar-buttons">
    <button class="btn" id="p-refresh" title="перечитать стаканы по всем предметам с нашими ордерами — только смотрит, ничего не меняет">Обновить стаканы</button>
    <button class="btn" id="j-sync" title="спросить CSFloat, какие ордера реально стоят, и привести запись бота в соответствие">Сверить с аккаунтом</button>
    <button class="btn" id="j-weakest" title="снять один стоящий ордер с самым низким рангом плана — чтобы освободить лимит CSFloat, когда правки цены отказывают «не хватило баланса»">Снять самый слабый ордер</button>
    <button class="btn" id="j-reload">Обновить</button>
  </div>
</div>
<div class="muted" id="p-note"></div>
<div class="weakest-line" id="j-weakest-info"></div>

<div id="j-summary" class="journal-summary"></div>

<section class="settings-block problems-block">
  <div class="problems-head">
    <h2 id="j-attention-title">Проблемы</h2>
    <button class="btn small" id="j-unhide" hidden>показать скрытые</button>
  </div>
  <div id="j-attention" class="problems-scroll"></div>
</section>

<section class="settings-block">
  <div class="journal-controls">
    <h2 class="grow-title">Ордера сейчас</h2>
    <label class="grow">поиск
      <input id="j-search" class="input" type="search" placeholder="например, Fade или Karambit">
    </label>
    <label>показать
      <select id="j-show" class="input">
        <option value="">все</option>
        <option value="outbid">перебитые</option>
        <option value="first">первые</option>
        <option value="ceiling">на потолке</option>
      </select>
    </label>
  </div>
  <div id="p-table"></div>
</section>

<section class="settings-block">
  <details id="j-history-box">
    <summary><h2 class="inline-h2">История</h2>
      <span class="muted">— всё, что бот делал: поставлен, поднят, снижен, исполнен, снят</span></summary>
    <div class="journal-controls">
      <label>период
        <select id="j-period" class="input">
          <option value="today">сегодня</option>
          <option value="24">24 часа</option>
          <option value="168" selected>7 дней</option>
          <option value="720">30 дней</option>
          <option value="0">всё время</option>
        </select>
      </label>
      <label>действие
        <select id="j-kind" class="input">
          <option value="">все</option>
          <option value="place">поставлено</option>
          <option value="raise">поднята цена</option>
          <option value="lower">снижена цена</option>
          <option value="fill">исполнено</option>
          <option value="cancel">снято</option>
          <option value="room">снято ради места</option>
          <option value="fail">отказы</option>
        </select>
      </label>
      <label class="arm-line">
        <input type="checkbox" id="j-dry"> холостые
      </label>
    </div>
    <div class="muted" id="j-note"></div>
    <div id="j-table"></div>
  </details>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ asset('common.js') }}"></script>
<script src="{{ asset('journal.js') }}"></script>
{% endblock %}
